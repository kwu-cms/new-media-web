<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>卒業研究アーカイブ（2020–2025） - ニューメディア研究ゼミ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="archive-body">
    <nav class="navbar navbar-expand-lg navbar-dark bg-gradient fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-graduation-cap me-2"></i>ニューメディア研究ゼミ
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">2025年度一覧</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="archive.html">卒業研究アーカイブ</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="archive-header">
        <div class="archive-header-bg"></div>
        <div class="container archive-header-inner">
            <nav class="archive-breadcrumb" aria-label="パンくずリスト">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="index.html">ニューメディア研究ゼミ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">卒業研究アーカイブ</li>
                </ol>
            </nav>
            <div class="archive-header-content">
                <p class="archive-header-label">Archive</p>
                <h1 class="archive-header-title">卒業研究アーカイブ</h1>
                <p class="archive-header-desc">2020年度〜2025年度の制作レポート題目を、年度・タグで横断検索できます。</p>
            </div>
        </div>
    </header>

    <main class="archive-main">
        <div class="container">
            <div class="archive-layout">
                <!-- Sidebar Filters -->
                <aside class="archive-sidebar" id="archive-sidebar">
                    <div class="archive-sidebar-inner">
                        <div class="archive-sidebar-header">
                            <h2 class="archive-sidebar-title">絞り込み</h2>
                            <button type="button" class="archive-clear-btn" id="clear-filters-btn" title="条件をクリア">
                                <i class="fas fa-rotate-left"></i>
                            </button>
                        </div>

                        <div class="archive-search-wrap">
                            <i class="fas fa-search archive-search-icon" aria-hidden="true"></i>
                            <input type="search" class="archive-search-input" id="search-input"
                                   placeholder="題目・タグで検索" autocomplete="off">
                        </div>

                        <div class="archive-filter-block">
                            <h3 class="archive-filter-heading">
                                <span class="archive-filter-heading-icon"><i class="fas fa-calendar-alt"></i></span>
                                年度
                            </h3>
                            <div class="archive-filter-pills" id="year-filters"></div>
                        </div>

                        <div class="archive-filter-block">
                            <h3 class="archive-filter-heading">
                                <span class="archive-filter-heading-icon"><i class="fas fa-palette"></i></span>
                                表現技法
                            </h3>
                            <div class="archive-filter-pills archive-tag-pills" id="technique-filters"></div>
                        </div>

                        <div class="archive-filter-block">
                            <h3 class="archive-filter-heading">
                                <span class="archive-filter-heading-icon"><i class="fas fa-lightbulb"></i></span>
                                テーマ
                            </h3>
                            <div class="archive-filter-pills archive-tag-pills" id="theme-filters"></div>
                        </div>
                    </div>
                </aside>

                <!-- Results -->
                <div class="archive-content">
                    <div class="archive-content-toolbar">
                        <p class="archive-result-count" id="result-count"></p>
                    </div>

                    <div id="loading" class="archive-state">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">読み込み中...</span>
                        </div>
                        <p>データを読み込んでいます...</p>
                    </div>

                    <div id="error" class="archive-state archive-state-error" style="display: none;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>データの読み込みに失敗しました。</p>
                    </div>

                    <div id="archive-results" style="display: none;"></div>

                    <div id="no-results" class="archive-state" style="display: none;">
                        <i class="fas fa-search archive-state-icon"></i>
                        <p>条件に一致する研究題目が見つかりませんでした。</p>
                        <button type="button" class="btn btn-outline-primary btn-sm mt-2" id="clear-filters-btn-alt">
                            条件をクリア
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-section">
        <div class="container py-4">
            <div class="row">
                <div class="col-12 text-center">
                    <p class="mb-0">&copy; 2025 甲南女子大学文学部メディア表現学科ニューメディア研究ゼミ</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/archive.js"></script>
</body>
</html>
